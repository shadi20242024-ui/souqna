name: SOUQNA staging checks
on:
  push:
    branches:
      - feature/news-media-2026-11-16
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check media validation
        run: node --test tests/ad-media.test.mjs
      - name: Check safe hosting build
        run: npm run test:build-isolation && npm run build:hosting
      - name: Validate scoped Firestore permissions in local emulator
        run: npx firebase emulators:exec --project demo-souqna-rules --only firestore,auth "node --test tests/scoped-moderators.test.mjs"
