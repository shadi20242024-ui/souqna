name: SOUQNA security checks
on:
  push:
    branches:
      - audit/**
  pull_request:
    paths:
      - 'firebase/**'
      - 'functions/**'
      - 'index.html'
      - 'scripts/**'
      - '.github/workflows/security-checks.yml'
permissions:
  contents: read
jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase test dependencies
        working-directory: firebase
        run: npm install --no-audit --no-fund
      - name: Run Firestore rules tests in local emulator
        working-directory: firebase
        run: npm run test:rules
  functions-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check callable functions syntax
        run: node --check functions/index.js
      - name: Test callable authorization and input validation
        working-directory: functions
        run: node --test tests/authorization.test.cjs
  admin-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check application module and secure approval handlers
        run: node --experimental-vm-modules scripts/check-admin-financial-handlers.cjs
      - name: Test news ticker and verified premium banner
        run: node --test scripts/check-news-and-premium.cjs

  functions-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase emulator dependencies
        working-directory: firebase
        run: npm install --no-audit --no-fund
      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Run real Firestore transaction integration tests
        working-directory: firebase
        run: npx firebase emulators:exec --project demo-souqna --only firestore,auth "cd ../functions && node --test tests/transactions.integration.cjs"
      - name: Verify signup, ads and sponsor flows using isolated Auth and Firestore Emulators
        working-directory: firebase
        run: npx firebase emulators:exec --project demo-souqna --only firestore,auth "node --test tests/staging-flows.test.cjs"
